name: Native packages
on:
  workflow_dispatch:
  push:
    tags: ["v1.1.*", "v1.[2-9].*", "v[2-9].*"]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run release:portable
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: release/*.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: test-results/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: windows-11-arm
            target: win
            arch: arm64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix native/desktop
      - run: npm run pack --prefix native/desktop -- --${{ matrix.target }} --${{ matrix.arch }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-desktop.mjs
      - if: runner.os != 'Linux'
        run: node scripts/test-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/desktop/*.exe
            release/desktop/*.dmg
            release/desktop/*.AppImage
            release/desktop/*.deb
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tests-${{ matrix.target }}-${{ matrix.arch }}
          path: test-results/
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci && npm run build && npx cap sync android
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chinese-studio.jks"
          chmod 600 "$RUNNER_TEMP/chinese-studio.jks"
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chinese-studio.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../release/android
          cp app/build/outputs/apk/release/app-release.apk ../release/android/chinese-studio-1.1.0-android.apk
          cd ..
          python3 scripts/verify-apk.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android 15 offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            (cd android && ./gradlew --no-daemon connectedDebugAndroidTest)
            bash scripts/test-android-release.sh
      - name: Test Android 16 offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            (cd android && ./gradlew --no-daemon connectedDebugAndroidTest)
            bash scripts/test-android-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/android/*.apk
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: portable
          path: release
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -type f ! -name '*.exe' ! -name '*.dmg' ! -name '*.AppImage' ! -name '*.deb' ! -name '*.apk' ! -name '*.zip' -delete
          cd release
          sha256sum *.exe *.dmg *.AppImage *.deb *.apk *.zip > SHA256SUMS
          cd ..
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.dmg release/*.AppImage release/*.deb release/*.apk release/*.zip release/SHA256SUMS --title "Chinese Studio $GITHUB_REF_NAME" --notes-file docs/NATIVE_RELEASE.md
