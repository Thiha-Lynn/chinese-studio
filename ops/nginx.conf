# No query strings in access logs: OAuth callback codes remain private.
log_format chinese_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name chinese.ztvmm.live;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { return 301 https://chinese.ztvmm.live$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chinese.ztvmm.live;
    ssl_certificate /etc/letsencrypt/live/chinese-studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinese-studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 256k;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    access_log /var/log/nginx/chinese-studio.access.log chinese_safe;
    error_log /var/log/nginx/chinese-studio.error.log warn;
}
